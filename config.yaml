# College Closure Early-Warning Pipeline — Phase 0 config
# Years follow IPEDS "fall of academic year" convention (2023 = 2023-24).

years:
  start: 2004
  # null = latest year advertised on Urban Institute /api/v1/api-endpoints/
  end: null

label_horizon_years: 3
label_horizons: [2, 3]
labels:
  mergers_are_positive: true
  # Off by default: filtered-universe exits are not closures. IPEDS status +
  # date_closed + FSA Closed School are the primary sources.
  use_disappearance: false

model:
  train_end: 2016
  val_years: [2017, 2018, 2019]
  test_years: [2020, 2021]
  recall_at_k: [25, 50, 100]
  random_seed: 42

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs

filters:
  degree_granting: 1
  # Urban IPEDS directory field is inst_control (user-facing alias: control)
  control: [1, 2, 3]  # 1 public, 2 private nonprofit, 3 for-profit
  # Title IV participating codes (applied only when title_iv_indicator is reported)
  title_iv_participating: [1, 2, 4, 8]
  drop_admin_sector: 0
  drop_nondegree_inst_category: [5, 6]
  drop_name_patterns:
    - system office
    - system administration
    - central office
    - administrative office
    - administrative unit

urban:
  api_base: https://educationdata.urban.org/api/v1
  csv_base: https://educationdata.urban.org/csv
  request_timeout_seconds: 120
  max_retries: 4
  retry_backoff_seconds: 4

# Verified 2026-09 against Urban api-endpoints + api-downloads.
# CSV names come from https://educationdata.urban.org/api/v1/api-downloads/
# Prefer a single all-years CSV when it is smaller/faster than paging the API.
# Yearly fall-enrollment-race CSVs are ~110MB each; filtered API totals are faster.
sources:
  directory:
    required: true
    endpoint: directory
    endpoint_id: 1
    method: csv
    csv_file: colleges_ipeds_directory.csv
    csv_dir: ipeds
  fall_enrollment:
    required: true
    endpoint: fall-enrollment
    endpoint_id: 13
    method: api_totals
    # Fallback if the filtered API is unavailable
    csv_dir: ipeds
    csv_pattern: colleges_ipeds_fall-enrollment-race_{year}.csv
    levels: [undergraduate, graduate, first-professional]
    api_filters:
      race: 99
      sex: 99
      ftpt: 99
      degree_seeking: 99
      class_level: 99
  enrollment_fte:
    required: false
    endpoint: enrollment-full-time-equivalent
    endpoint_id: 9
    method: csv
    csv_file: colleges_ipeds_enrollment-fte.csv
    csv_dir: ipeds
  finance:
    required: false
    endpoint: finance
    endpoint_id: 91
    method: csv
    csv_file: colleges_ipeds_finance.csv
    csv_dir: ipeds
    # Urban metadata currently lists finance only through 2017; ingest logs the gap.
  admissions:
    required: false
    endpoint: admissions-enrollment
    endpoint_id: 3
    method: csv
    csv_file: colleges_ipeds_admissions-enrollment.csv
    csv_dir: ipeds
  instructional_staff:
    required: false
    endpoint: salaries-instructional-staff
    endpoint_id: 102
    method: api_totals
    api_filters:
      academic_rank: 99
      sex: 99
      contract_length: 99
    csv_file: colleges_ipeds_salaries_is.csv
    csv_dir: ipeds
  noninstructional_staff:
    required: false
    endpoint: salaries-noninstructional-staff
    endpoint_id: 103
    method: api_totals
    api_filters:
      staff_category: 99
    csv_file: colleges_ipeds_salaries_nis.csv
    csv_dir: ipeds

nces:
  # Complete data files: https://nces.ed.gov/ipeds/datacenter/data/F{yy}{yy+1}_F{1A|2|3}.zip
  # F1819 = FY 2018 (fills Urban's post-2017 gap). F2223 is the latest confirmed zip.
  # F2324 / F2425 are tried (incl. _Data_Stata / _P / _RV suffixes). Standalone zips
  # still 404 as of 2026-09 even though NCES published Spring 2025 finance in tables.
  base_url: https://nces.ed.gov/ipeds/datacenter/data
  year_start: 2018
  year_end: 2025
  forms: [F1A, F2, F3]

fsa:
  urban_composite_csv: colleges_fsa_composite_scores.csv
  urban_csv_dir: fsa
  # Official year workbooks on data.ed.gov (CKAN package ff51fef3-9d22-49a7-b34b-54329a290307).
  data_ed_composite_package: ff51fef3-9d22-49a7-b34b-54329a290307
  # Current FSA Data Center locations (tried in order; pages move / often JS-only).
  hcm_urls:
    - https://studentaid.gov/sites/default/files/fsawg/datacenter/library/hcm.xlsx
    - https://studentaid.gov/sites/g/files/dbyssus161/files/media/data/hcm.xlsx
    - https://studentaid.gov/sites/default/files/hcm.xlsx
    - https://www2.ed.gov/offices/OSFAP/PEPS/hcm.xlsx
  composite_urls:
    - https://studentaid.gov/sites/default/files/fsawg/datacenter/library/CompositeScores.xlsx
    - https://studentaid.gov/sites/default/files/CompositeScores.xlsx
    - https://studentaid.gov/sites/default/files/financial-responsibility-composite-scores.xlsx
  closed_school_urls:
    - https://fsapartners.ed.gov/sites/default/files/2026-09/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2026-08/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2026-01/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2025-12/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2025-09/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2025-01/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2024-12/ClosedSchoolSearchFile.xls
    - https://fsapartners.ed.gov/sites/default/files/2024-01/ClosedSchoolSearchFile.xls
    - https://studentaid.gov/sites/default/files/fsawg/datacenter/library/ClosedSchoolSearchFile.xls
    - https://www2.ed.gov/offices/OSFAP/PEPS/docs/closedschoolsearchfile.xls

scorecard:
  # API used when DATA_GOV_API_KEY or SCORECARD_API_KEY is set in the environment.
  # These are *names* of env vars — never put the key itself in this file.
  api_key_env:
    - DATA_GOV_API_KEY
    - SCORECARD_API_KEY
  # Otherwise the official no-key most-recent institution ZIP is tried.
  api_base: https://api.data.gov/ed/collegescorecard/v1/schools
  bulk_urls:
    - https://ed-public-download.scorecard.network/downloads/Most-Recent-Cohorts-Institution_06102026.zip
    - https://ed-public-download.scorecard.network/downloads/Most-Recent-Cohorts-Institution_05192025.zip

wiche:
  # Official 11th-edition Knocking workbook (Dec 2024). Derived CSV: state_abbr, year, hs_graduates.
  path: data/external/wiche_hs_graduates.csv
  url: https://www.wiche.edu/wp-content/uploads/2024/12/Knocking-at-the-College-Door-11th-Edition-Projections-Dataset-12-11-2024.xlsx
  urls:
    - https://www.wiche.edu/wp-content/uploads/2024/12/Knocking-at-the-College-Door-11th-Edition-Projections-Dataset-12-11-2024.xlsx

closure_trackers:
  higher_ed_dive_url: https://www.highereddive.com/news/tracker-college-closings-and-mergers/546692/
  bestcolleges_url: https://www.bestcolleges.com/research/closed-colleges-list-statistics-major-closures/
  curated_csv: data/external/closures_curated.csv
